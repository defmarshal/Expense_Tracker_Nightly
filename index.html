<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
    // Inisialisasi variabel global di awal
    let expenses = [];
    let customCategories = [];
    let subCategories = {}; 
    let categoryToDelete = null;
    let categoryChart = null;
    let expenseTrendChart = null; 
    
    // GitHub Gist Configuration
    let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
    let GIST_ID = localStorage.getItem('gist_id') || '';

    const currentMonthYear = new Date().toISOString().substring(0, 7);
    let selectedMonthYear = null; 
    let selectedAnalyticsMonthYear = 'all'; 

    const today = new Date().toISOString().split('T')[0];
    
    // =========================================================
    // AWAL FUNGSI (Pastikan semua fungsi ada di sini)
    // =========================================================

    function updateSyncStatus(message, color) {
        const statusDiv = document.getElementById('syncStatus');
        if (statusDiv) {
            statusDiv.textContent = message || (GITHUB_TOKEN ? '✓ Configured' : 'Not configured');
            statusDiv.style.color = color || (GITHUB_TOKEN ? '#43e97b' : '#999');
        }
    }
    
    function updateLastSyncTime() {
        const lastSync = localStorage.getItem('last_sync');
        const lastSyncDiv = document.getElementById('lastSync');
        if (lastSyncDiv && lastSync) {
            const date = new Date(lastSync);
            lastSyncDiv.textContent = `Last synced: ${date.toLocaleString()}`;
        }
    }

    function openCategoryModal() {
        document.getElementById('categoryModal').classList.add('active');
        document.getElementById('newCategoryName').value = '';
        document.getElementById('newCategoryName').focus();
    }

    function closeCategoryModal() {
        document.getElementById('categoryModal').classList.remove('active');
        document.getElementById('category').value = 'Other';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('active');
        categoryToDelete = null;
    }

    function openDeleteModal(categoryName) {
        categoryToDelete = categoryName;
        document.getElementById('deleteMessage').textContent = `Are you sure you want to delete "${categoryName}"?`;
        document.getElementById('deleteModal').classList.add('active');
    }

    function confirmDelete() {
        if (categoryToDelete) {
            customCategories = customCategories.filter(c => c !== categoryToDelete);
            saveCategories();
            updateCategoryDropdown();
            renderCategories();
            closeDeleteModal();
            
            if (GITHUB_TOKEN && GIST_ID) {
                syncToGist();
            }
        }
    }

    function saveNewCategory() {
        const newCategory = document.getElementById('newCategoryName').value.trim();
        if (newCategory) {
            if (!customCategories.includes(newCategory)) {
                customCategories.push(newCategory);
                saveCategories();
                updateCategoryDropdown();
            }
            document.getElementById('category').value = newCategory;
            document.getElementById('categoryModal').classList.remove('active');
        } else {
            alert('Please enter a category name');
        }
    }

    function loadExpenses() {
        const storedExpenses = localStorage.getItem('expenses');
        if (storedExpenses) {
            try {
                expenses = JSON.parse(storedExpenses);
            } catch (e) {
                console.error("Error parsing expenses from localStorage", e);
                expenses = [];
            }
        }
        if (GITHUB_TOKEN && GIST_ID) {
            loadFromGist();
        } else {
            renderExpensePageFilter();
            renderExpenses();
        }
    }

    function loadCategories() {
        const storedCategories = localStorage.getItem('customCategories');
        if (storedCategories) {
            try {
                customCategories = JSON.parse(storedCategories);
            } catch (e) {
                console.error("Error parsing categories from localStorage", e);
                customCategories = [];
            }
        }
        const storedSubCategories = localStorage.getItem('subCategories');
        if (storedSubCategories) {
             try {
                subCategories = JSON.parse(storedSubCategories);
            } catch (e) {
                console.error("Error parsing subCategories from localStorage", e);
                subCategories = {};
            }
        }
        updateCategoryDropdown();
    }

    function saveExpenses() {
        localStorage.setItem('expenses', JSON.stringify(expenses));
    }

    function saveCategories() {
        localStorage.setItem('customCategories', JSON.stringify(customCategories));
        localStorage.setItem('subCategories', JSON.stringify(subCategories));
    }
    
    // FUNGSI GIST (dilewati untuk keringkasan, diasumsikan tidak diubah dari perbaikan sebelumnya)
    async function findExistingGist() {
        // ... (implementation remains the same)
        try {
            const response = await fetch('https://api.github.com/gists', {
                headers: { 'Authorization': `token ${GITHUB_TOKEN}` }
            });
            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error('Failed to fetch gists list. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
            }
            const gists = await response.json();
            const existingGist = gists.find(g => 
                g.description === 'Expense Tracker Data' && g.files && g.files['expense-data.json']
            );
            return existingGist ? existingGist.id : null;
        } catch (error) {
            console.error('Error finding existing Gist:', error);
            return null;
        }
    }

    async function saveGitHubToken() {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) {
            alert('Please enter a GitHub token');
            return;
        }

        GITHUB_TOKEN = token;
        localStorage.setItem('github_token', token);
        
        GIST_ID = '';
        localStorage.removeItem('gist_id');

        await syncToGist();
    }

    async function syncToGist() {
        if (!GITHUB_TOKEN) {
            alert('Please configure GitHub token first');
            return;
        }
        const data = { expenses: expenses, categories: customCategories, subCategories: subCategories };
        try {
            updateSyncStatus('Syncing...', '#667eea');
            
            if (!GIST_ID) {
                const foundId = await findExistingGist();
                if (foundId) {
                    GIST_ID = foundId;
                    localStorage.setItem('gist_id', GIST_ID);
                    await loadFromGist(true); 
                }
            }
            // ... (gist update/create logic remains the same)
            let response;
            if (GIST_ID) {
                response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: { 'expense-data.json': { content: JSON.stringify(data, null, 2) } } })
                });
            } else {
                response = await fetch('https://api.github.com/gists', {
                    method: 'POST',
                    headers: { 'Authorization': `token ${GITHUB_TOKEN}`, 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: 'Expense Tracker Data', public: false, files: { 'expense-data.json': { content: JSON.stringify(data, null, 2) } } })
                });
            }

            if (!response.ok) {
                 const errorBody = await response.json();
                 throw new Error('Failed to sync gist. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
            }
            if (!GIST_ID) {
                const gist = await response.json();
                GIST_ID = gist.id;
                localStorage.setItem('gist_id', GIST_ID);
            }
            updateSyncStatus('✓ Synced successfully' + (GIST_ID ? '' : ' (new gist created)'), '#43e97b');
            localStorage.setItem('last_sync', new Date().toISOString());
            updateLastSyncTime();
        } catch (error) {
            console.error('Sync error:', error);
            updateSyncStatus('✗ Sync failed: ' + error.message, '#ff4757');
        }
    }

    async function loadFromGist(forceLoad = false) {
        if (!GITHUB_TOKEN || !GIST_ID || (!forceLoad && expenses.length > 0 && customCategories.length > 0)) return;

        try {
            updateSyncStatus('Loading from GitHub...', '#667eea');
            const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, { headers: { 'Authorization': `token ${GITHUB_TOKEN}` } });
            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error('Failed to load from gist. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
            }

            const gist = await response.json();
            if (!gist.files || !gist.files['expense-data.json']) throw new Error('Gist file not found or empty.');
            
            const content = gist.files['expense-data.json'].content;
            const data = JSON.parse(content);

            expenses = data.expenses || [];
            customCategories = data.categories || [];
            subCategories = data.subCategories || {};

            fixExpensesFormat();
            saveExpenses(); 
            saveCategories();

            updateCategoryDropdown();
            renderExpensePageFilter(); 
            renderAnalyticsPageFilter();
            renderExpenses();
            
            updateSyncStatus('✓ Data dimuat dari GitHub.', '#43e97b');
        } catch (error) {
            console.error('Load error:', error);
            updateSyncStatus('Could not load from GitHub: ' + error.message, '#ff4757');
        }
    }

    async function manualSync() { await syncToGist(); }
    async function fixAllExpenses() { /* ... */ }
    function fixExpensesFormat() { /* ... */ }
    
    // FUNGSI FILTER BULAN
    function populateMonthFilter(selectId, selectedValue) {
        const select = document.getElementById(selectId);
        if (!select) return;

        const allMonths = new Set();
        expenses.forEach(expense => {
            if (expense.date) {
                const monthYear = expense.date.substring(0, 7);
                allMonths.add(monthYear);
            }
        });

        const sortedMonths = Array.from(allMonths).sort((a, b) => new Date(b) - new Date(a));
        
        select.innerHTML = '';
        
        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = 'All Time';
        select.appendChild(allOption);
        
        sortedMonths.forEach(monthYear => {
            const option = document.createElement('option');
            option.value = monthYear;
            const date = new Date(monthYear + '-01');
            const monthName = date.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            option.textContent = monthName;
            select.appendChild(option);
        });
        
        select.value = selectedValue;
    }

    function renderExpensePageFilter() {
        let defaultSelection = 'all';
        const months = new Set(expenses.map(e => e.date ? e.date.substring(0, 7) : ''));
        
        if (months.has(currentMonthYear)) {
            defaultSelection = currentMonthYear;
        } else if (months.size > 0) {
            const sortedMonths = Array.from(months).filter(m => m).sort();
            defaultSelection = sortedMonths.length > 0 ? sortedMonths.pop() : 'all';
        }
        
        if (selectedMonthYear === null || selectedMonthYear === undefined) {
            selectedMonthYear = defaultSelection;
        }

        populateMonthFilter('monthFilter', selectedMonthYear);
    }
    
    function filterExpensesByMonth() {
        selectedMonthYear = document.getElementById('monthFilter').value;
        renderExpenses();
    }

    function renderAnalyticsPageFilter() {
        populateMonthFilter('analyticsMonthFilter', selectedAnalyticsMonthYear);
    }

    function filterAnalyticsByMonth() {
        selectedAnalyticsMonthYear = document.getElementById('analyticsMonthFilter').value;
        renderAnalytics(); 
    }

    function showPage(pageName) {
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });

        // Set active class on the clicked tab
        if (event && event.target && event.target.classList.contains('nav-tab')) {
            event.target.classList.add('active');
        }

        if (pageName === 'expenses') {
            document.getElementById('expensesPage').classList.add('active');
            renderExpensePageFilter(); 
            renderExpenses();
        } else if (pageName === 'analytics') {
            document.getElementById('analyticsPage').classList.add('active');
            renderAnalyticsPageFilter();
            renderAnalytics();
        } else if (pageName === 'categories') {
            document.getElementById('categoriesPage').classList.add('active');
            renderCategories();
        } else if (pageName === 'subcategories') {
            document.getElementById('subCategoriesPage').classList.add('active');
            updateParentCategorySelect();
            renderSubCategories();
        } else if (pageName === 'settings') {
            document.getElementById('settingsPage').classList.add('active');
            updateSyncStatus();
            updateLastSyncTime();
        }
    }

    // FUNGSI RENDER CHART & EXPENSES (dilewati untuk keringkasan, diasumsikan sudah benar)
    function renderAnalytics() { /* ... implementation remains the same ... */ }
    function toggleSubCategories(categoryId) { /* ... implementation remains the same ... */ }
    function updateParentCategorySelect() { /* ... implementation remains the same ... */ }
    function addSubCategory() { /* ... implementation remains the same ... */ }
    function deleteSubCategory(parentCat, subCat) { /* ... implementation remains the same ... */ }
    function renderSubCategories() { /* ... implementation remains the same ... */ }
    function addCategoryFromPage() { /* ... implementation remains the same ... */ }
    function renderCategories() { /* ... implementation remains the same ... */ }
    function updateCategoryDropdown() { /* ... implementation remains the same ... */ }
    function addExpense() { /* ... implementation remains the same ... */ }
    function deleteExpense(id) { /* ... implementation remains the same ... */ }
    function renderExpenses() { /* ... implementation remains the same ... */ }

    // Implementasi lengkap dari fungsi-fungsi di atas (renderAnalytics, renderExpenses, dll.) harus ada di file Anda.
    // Jika Anda hanya menyalin potongan kode, ini akan menyebabkan error. Pastikan semua fungsi ada!

    // =========================================================
    // AKHIR FUNGSI
    // =========================================================

    // ************* PERBAIKAN KRITIS BERADA DI SINI *************
    document.addEventListener('DOMContentLoaded', function() {
        // Handle input formatting on load
        if (document.getElementById('amount')) {
            document.getElementById('amount').addEventListener('input', function(e) {
                let value = e.target.value.replace(/\D/g, '');
                if (value) { value = parseInt(value).toLocaleString('id-ID'); }
                e.target.value = value;
            });
        }
        
        // Handle category selection on load
        if (document.getElementById('category')) {
            document.getElementById('category').onchange = function() {
                if (this.value === '__new__') {
                    openCategoryModal();
                }
            };
        }
        
        if (document.getElementById('newCategoryName')) {
            document.getElementById('newCategoryName').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { saveNewCategory(); }
            });
        }

        if (document.getElementById('newCategoryInput')) {
            document.getElementById('newCategoryInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { addCategoryFromPage(); }
            });
        }

        if (document.getElementById('newSubCategoryInput')) {
             document.getElementById('newSubCategoryInput').addEventListener('keypress', function(e) {
                if (e.key === 'Enter') { addSubCategory(); }
            });
        }
        
        // Load data and render UI
        loadCategories(); // Memuat kategori dan memanggil updateCategoryDropdown()
        loadExpenses(); // Memuat pengeluaran dan memanggil renderExpenses() / loadFromGist()

        // Set default tab 'Expenses' sebagai aktif saat pertama kali dimuat
        document.getElementById('expensesPage').classList.add('active');
        const defaultTab = document.querySelector('.nav-tab[onclick="showPage(\'expenses\')"]');
        if (defaultTab) {
            defaultTab.classList.add('active');
        }

        // Tampilkan info Gist jika ada
        if (GITHUB_TOKEN) {
            document.getElementById('githubToken').value = GITHUB_TOKEN;
            updateSyncStatus();
            updateLastSyncTime();
        }
        
        // Atur tanggal hari ini
        if (document.getElementById('date')) {
            document.getElementById('date').value = today;
        }
    });

</script>
