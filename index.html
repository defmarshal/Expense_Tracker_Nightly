<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<script>
    let expenses = [];
    let customCategories = [];
    let subCategories = {}; // { categoryName: [subcat1, subcat2, ...] }
    let categoryToDelete = null;
    let categoryChart = null;
    let expenseTrendChart = null; // NEW: Global variable for Line Chart
    
    // GitHub Gist Configuration
    let GITHUB_TOKEN = localStorage.getItem('github_token') || '';
    let GIST_ID = localStorage.getItem('gist_id') || '';

    // Variabel untuk melacak bulan yang sedang difilter
    const currentMonthYear = new Date().toISOString().substring(0, 7);
    let selectedMonthYear = currentMonthYear; // Untuk Expenses Page
    let selectedAnalyticsMonthYear = 'all'; // NEW: Untuk Analytics Page

    // Set today's date as default
    const today = new Date().toISOString().split('T')[0];
    document.getElementById('date').value = today;

    // Load GitHub token on startup
    if (GITHUB_TOKEN) {
        document.getElementById('githubToken').value = GITHUB_TOKEN;
        updateSyncStatus();
    }

    // Format number input with thousand separator
    const amountInput = document.getElementById('amount');
    amountInput.addEventListener('input', function(e) {
        let value = e.target.value.replace(/\D/g, '');
        if (value) {
            value = parseInt(value).toLocaleString('id-ID');
        }
        e.target.value = value;
    });

    // Handle category selection
    const catSelect = document.getElementById('category');
    catSelect.onchange = function() {
        console.log('Category changed to:', this.value);
        if (this.value === '__new__') {
            openCategoryModal();
        }
    };

    function openCategoryModal() {
        document.getElementById('categoryModal').classList.add('active');
        document.getElementById('newCategoryName').value = '';
        document.getElementById('newCategoryName').focus();
    }

    function closeCategoryModal() {
        document.getElementById('categoryModal').classList.remove('active');
        document.getElementById('category').value = 'Other';
    }

    function closeDeleteModal() {
        document.getElementById('deleteModal').classList.remove('active');
        categoryToDelete = null;
    }

    function openDeleteModal(categoryName) {
        categoryToDelete = categoryName;
        document.getElementById('deleteMessage').textContent = `Are you sure you want to delete "${categoryName}"?`;
        document.getElementById('deleteModal').classList.add('active');
    }

    function confirmDelete() {
        if (categoryToDelete) {
            customCategories = customCategories.filter(c => c !== categoryToDelete);
            saveCategories();
            updateCategoryDropdown();
            renderCategories();
            closeDeleteModal();
            
            // Auto-sync to GitHub if configured
            if (GITHUB_TOKEN && GIST_ID) {
                syncToGist();
            }
        }
    }

    function saveNewCategory() {
        const newCategory = document.getElementById('newCategoryName').value.trim();
        if (newCategory) {
            if (!customCategories.includes(newCategory)) {
                customCategories.push(newCategory);
                saveCategories();
                updateCategoryDropdown();
            }
            document.getElementById('category').value = newCategory;
            document.getElementById('categoryModal').classList.remove('active');
        } else {
            alert('Please enter a category name');
        }
    }

    // Allow Enter key to save category
    document.getElementById('newCategoryName').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            saveNewCategory();
        }
    });

    // Load expenses from storage on startup
    loadExpenses();
    loadCategories();

    // --- FUNGSI GIST BARU/MODIFIKASI ---
    
    async function findExistingGist() {
        try {
            const response = await fetch('https://api.github.com/gists', {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`
                }
            });

            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error('Failed to fetch gists list. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
            }
            
            const gists = await response.json();
            
            const existingGist = gists.find(g => 
                g.description === 'Expense Tracker Data' && 
                g.files && 
                g.files['expense-data.json']
            );
            
            if (existingGist) {
                console.log('Found existing Gist ID:', existingGist.id);
                return existingGist.id;
            }
            
            return null;
            
        } catch (error) {
            console.error('Error finding existing Gist:', error);
            return null;
        }
    }

    async function saveGitHubToken() {
        const token = document.getElementById('githubToken').value.trim();
        if (!token) {
            alert('Please enter a GitHub token');
            return;
        }

        GITHUB_TOKEN = token;
        localStorage.setItem('github_token', token);
        
        GIST_ID = '';
        localStorage.removeItem('gist_id');

        await syncToGist();
    }

    async function syncToGist() {
        if (!GITHUB_TOKEN) {
            alert('Please configure GitHub token first');
            return;
        }

        const data = {
            expenses: expenses,
            categories: customCategories,
            subCategories: subCategories
        };

        try {
            updateSyncStatus('Syncing...', '#667eea');
            
            if (!GIST_ID) {
                const foundId = await findExistingGist();
                if (foundId) {
                    GIST_ID = foundId;
                    localStorage.setItem('gist_id', GIST_ID);
                    updateSyncStatus('✓ Gist ID ditemukan. Mencoba memuat data lama.', '#ffc107');
                    await loadFromGist(true); 
                }
            }

            if (GIST_ID) {
                const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                    method: 'PATCH',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        files: {
                            'expense-data.json': {
                                content: JSON.stringify(data, null, 2)
                            }
                        }
                    })
                });

                if (!response.ok) {
                     const errorBody = await response.json();
                     throw new Error('Failed to update gist. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
                }
                updateSyncStatus('✓ Synced successfully', '#43e97b');
            } else {
                const response = await fetch('https://api.github.com/gists', {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${GITHUB_TOKEN}`,
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        description: 'Expense Tracker Data',
                        public: false,
                        files: {
                            'expense-data.json': {
                                content: JSON.stringify(data, null, 2)
                            }
                        }
                    })
                });

                if (!response.ok) {
                     const errorBody = await response.json();
                     throw new Error('Failed to create gist. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
                }
                
                const gist = await response.json();
                GIST_ID = gist.id;
                localStorage.setItem('gist_id', GIST_ID);
                updateSyncStatus('✓ Synced successfully (new gist created)', '#43e97b');
            }

            localStorage.setItem('last_sync', new Date().toISOString());
            updateLastSyncTime();
        } catch (error) {
            console.error('Sync error:', error);
            updateSyncStatus('✗ Sync failed: ' + error.message, '#ff4757');
        }
    }

    async function loadFromGist(forceLoad = false) {
        if (!GITHUB_TOKEN || !GIST_ID) {
            return;
        }
        
        if (!forceLoad && expenses.length > 0 && customCategories.length > 0) {
            return;
        }

        try {
            updateSyncStatus('Loading from GitHub...', '#667eea');

            const response = await fetch(`https://api.github.com/gists/${GIST_ID}`, {
                headers: {
                    'Authorization': `token ${GITHUB_TOKEN}`
                }
            });

            if (!response.ok) {
                const errorBody = await response.json();
                throw new Error('Failed to load from gist. Status: ' + response.status + (errorBody.message ? ' - ' + errorBody.message : ''));
            }

            const gist = await response.json();
            
            if (!gist.files || !gist.files['expense-data.json']) {
                throw new Error('Gist file not found or empty.');
            }
            
            const content = gist.files['expense-data.json'].content;
            const data = JSON.parse(content);

            expenses = data.expenses || [];
            customCategories = data.categories || [];
            subCategories = data.subCategories || {};

            fixExpensesFormat();

            updateCategoryDropdown();
            renderExpensePageFilter(); 
            renderAnalyticsPageFilter(); // NEW: Render filter analytics
            renderExpenses();
            
            if (forceLoad) {
                 updateSyncStatus('✓ Data dimuat dari GitHub (ID ditemukan).', '#43e97b');
            } else {
                 updateSyncStatus('✓ Loaded from GitHub', '#43e97b');
            }
        } catch (error) {
            console.error('Load error:', error);
            updateSyncStatus('Could not load from GitHub: ' + error.message, '#ff4757');
        }
    }
    
    // --- AKHIR FUNGSI GIST ---

    function updateSyncStatus(message, color) {
        const statusDiv = document.getElementById('syncStatus');
        if (statusDiv) {
            statusDiv.textContent = message || (GITHUB_TOKEN ? '✓ Configured' : 'Not configured');
            statusDiv.style.color = color || (GITHUB_TOKEN ? '#43e97b' : '#999');
        }
    }

    function updateLastSyncTime() {
        const lastSync = localStorage.getItem('last_sync');
        const lastSyncDiv = document.getElementById('lastSync');
        if (lastSyncDiv && lastSync) {
            const date = new Date(lastSync);
            lastSyncDiv.textContent = `Last synced: ${date.toLocaleString()}`;
        }
    }

    async function manualSync() {
        await syncToGist();
    }

    async function fixAllExpenses() {
        console.log('Manual fix triggered...');
        fixExpensesFormat();
        
        if (expenses.length > 0) {
            saveExpenses();
            await syncToGist();
            renderExpenses();
            alert('Expense data format fixed! Check Analytics tab now.');
        } else {
            alert('No expenses to fix.');
        }
    }

    function fixExpensesFormat() {
        console.log('Fixing expenses format...');
        
        let fixedCount = 0;
        expenses = expenses.map(expense => {
            let currentCategory = expense.category || '';
            let currentSubCategory = expense.subCategory || '';

            if (currentCategory.includes(':')) {
                const parts = currentCategory.split(':');
                fixedCount++;
                
                return {
                    ...expense,
                    category: parts[0],
                    subCategory: parts.slice(1).join(':')
                };
            }
            
            return expense;
        });
        
        console.log(`Fixed ${fixedCount} expenses`);
        
        return fixedCount;
    }

    // Try to load from gist on startup if configured
    if (GITHUB_TOKEN && GIST_ID) {
        loadFromGist();
    }
    
    // FUNGSI BARU/MODIFIKASI FILTER BULAN
    function populateMonthFilter(selectId, selectedValue) {
        const select = document.getElementById(selectId);
        const allMonths = new Set();
        
        expenses.forEach(expense => {
            if (expense.date) {
                const monthYear = expense.date.substring(0, 7);
                allMonths.add(monthYear);
            }
        });

        const sortedMonths = Array.from(allMonths).sort((a, b) => new Date(b) - new Date(a));
        
        select.innerHTML = '';
        
        const allOption = document.createElement('option');
        allOption.value = 'all';
        allOption.textContent = 'All Time';
        select.appendChild(allOption);
        
        sortedMonths.forEach(monthYear => {
            const option = document.createElement('option');
            option.value = monthYear;
            
            const date = new Date(monthYear + '-01');
            const monthName = date.toLocaleString('id-ID', { month: 'long', year: 'numeric' });
            option.textContent = monthName;
            
            select.appendChild(option);
        });
        
        // Set bulan yang dipilih saat ini atau default ke 'all'
        select.value = selectedValue;
    }

    function renderExpensePageFilter() {
        // Tentukan default untuk Expenses Page (bulan saat ini jika ada data, atau 'all')
        let defaultSelection = 'all';
        const months = new Set(expenses.map(e => e.date.substring(0, 7)));
        if (months.has(currentMonthYear)) {
            defaultSelection = currentMonthYear;
        } else if (months.size > 0) {
            // Jika tidak ada data bulan ini, tampilkan bulan terakhir
            defaultSelection = Array.from(months).sort().pop();
        }
        
        if (selectedMonthYear === null || selectedMonthYear === undefined) {
            selectedMonthYear = defaultSelection;
        }

        populateMonthFilter('monthFilter', selectedMonthYear);
    }
    
    function filterExpensesByMonth() {
        selectedMonthYear = document.getElementById('monthFilter').value;
        renderExpenses();
    }

    // NEW: Fungsi untuk merender filter Analytics
    function renderAnalyticsPageFilter() {
        populateMonthFilter('analyticsMonthFilter', selectedAnalyticsMonthYear);
    }

    // NEW: Fungsi untuk mengubah filter Analytics
    function filterAnalyticsByMonth() {
        selectedAnalyticsMonthYear = document.getElementById('analyticsMonthFilter').value;
        renderAnalytics(); // Re-render analytics
    }
    // END NEW FILTER FUNCTIONS

    function showPage(pageName) {
        document.querySelectorAll('.nav-tab').forEach(tab => {
            tab.classList.remove('active');
        });
        event.target.classList.add('active');

        document.querySelectorAll('.page').forEach(page => {
            page.classList.remove('active');
        });

        if (pageName === 'expenses') {
            document.getElementById('expensesPage').classList.add('active');
            renderExpensePageFilter(); 
            renderExpenses();
        } else if (pageName === 'analytics') {
            document.getElementById('analyticsPage').classList.add('active');
            renderAnalyticsPageFilter(); // NEW: Panggil fungsi render filter
            renderAnalytics();
        } else if (pageName === 'categories') {
            document.getElementById('categoriesPage').classList.add('active');
            renderCategories();
        } else if (pageName === 'subcategories') {
            document.getElementById('subCategoriesPage').classList.add('active');
            updateParentCategorySelect();
            renderSubCategories();
        } else if (pageName === 'settings') {
            document.getElementById('settingsPage').classList.add('active');
            updateSyncStatus();
            updateLastSyncTime();
        }
    }

    function renderAnalytics() {
        // --- Bagian 1: Logika Pemrosesan Data untuk Trend Chart (Line Chart) ---
        
        const today = new Date();
        const startDate = new Date(today.getFullYear(), today.getMonth() - 3, 1);
        
        const dailyExpenses = {};
        let totalAllTimeSpending = 0; // NEW: Total ALL TIME (untuk perhitungan global jika diperlukan)

        // Filter dan hitung pengeluaran yang termasuk dalam periode 4 bulan terakhir untuk Trend Chart
        const recentExpenses = expenses.filter(expense => {
            if (!expense.date) return false;
            const expenseDate = new Date(expense.date + 'T00:00:00');
            return expenseDate >= startDate;
        });

        recentExpenses.forEach(expense => {
            const dateKey = expense.date; 
            if (!dailyExpenses[dateKey]) {
                dailyExpenses[dateKey] = 0;
            }
            dailyExpenses[dateKey] += expense.amount;
        });
        
        // Buat Line Chart (Trend Chart)
        if (expenseTrendChart) {
            expenseTrendChart.destroy();
        }
        
        // ... (Logika Line Chart tetap di sini, menggunakan dailyExpenses)
        if (recentExpenses.length > 0) {
            const dateLabels = [];
            let currentDate = new Date(startDate);
            
            while (currentDate <= today) {
                const yyyy = currentDate.getFullYear();
                const mm = String(currentDate.getMonth() + 1).padStart(2, '0');
                const dd = String(currentDate.getDate()).padStart(2, '0');
                dateLabels.push(`${yyyy}-${mm}-${dd}`);
                currentDate.setDate(currentDate.getDate() + 1);
            }
            
            const trendData = dateLabels.map(dateKey => dailyExpenses[dateKey] || 0);

            const ctxTrend = document.getElementById('expenseTrendChart').getContext('2d');
            expenseTrendChart = new Chart(ctxTrend, {
                type: 'line',
                data: {
                    labels: dateLabels.map(d => new Date(d).toLocaleDateString('id-ID', { day: 'numeric', month: 'short' })),
                    datasets: [{
                        label: 'Daily Expenses (Rp)',
                        data: trendData,
                        borderColor: '#667eea',
                        backgroundColor: 'rgba(102, 126, 234, 0.2)',
                        fill: true,
                        tension: 0.2,
                        pointRadius: 3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    scales: {
                        x: {
                            title: { display: true, text: 'Time' },
                            ticks: {
                                autoSkip: true,
                                maxRotation: 0,
                                minRotation: 0,
                                callback: function(val, index) {
                                    return index % 7 === 0 ? this.getLabelForValue(val) : '';
                                }
                            }
                        },
                        y: {
                            title: { display: true, text: 'Expense (Rp)' },
                            beginAtZero: true,
                            ticks: {
                                callback: function(value) {
                                    return 'Rp ' + value.toLocaleString('id-ID');
                                }
                            }
                        }
                    },
                    plugins: {
                        tooltip: {
                            callbacks: {
                                title: function(context) {
                                    return new Date(context[0].label).toLocaleDateString('id-ID', { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' });
                                },
                                label: function(context) {
                                    let label = context.dataset.label || '';
                                    if (label) { label += ': '; }
                                    label += 'Rp ' + context.parsed.y.toLocaleString('id-ID');
                                    return label;
                                }
                            }
                        }
                    }
                }
            });
        }
        // END Line Chart Logic
        
        // --- Bagian 2: Logika Category Chart (Pie Chart) & Breakdown ---
        
        // 1. FILTER DATA BERDASARKAN BULAN YANG DIPILIH
        let expensesToAnalyze = expenses;
        let chartTitle = "All Time";
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

        if (selectedAnalyticsMonthYear !== 'all') {
            expensesToAnalyze = expenses.filter(exp => exp.date && exp.date.startsWith(selectedAnalyticsMonthYear));
            
            const dateParts = selectedAnalyticsMonthYear.split('-');
            const year = dateParts[0];
            const monthIndex = parseInt(dateParts[1]) - 1;
            chartTitle = `${monthNames[monthIndex]} ${year}`;
        }

        // Perbarui judul Pie Chart
        document.getElementById('categoryChartTitle').textContent = `Spending by Category: ${chartTitle}`;

        const categoryData = {};
        let totalSpending = 0; // Total spending untuk SELECTED PERIOD

        // Hitung total dan subkategori menggunakan data yang sudah difilter
        expensesToAnalyze.forEach(expense => {
            const cat = expense.category || 'Uncategorized';
            
            if (!categoryData[cat]) {
                categoryData[cat] = {
                    total: 0,
                    subCategories: {}
                };
            }
            
            categoryData[cat].total += expense.amount;
            totalSpending += expense.amount; // Total SELECTED PERIOD

            if (expense.subCategory) {
                const subCat = expense.subCategory;
                if (!categoryData[cat].subCategories[subCat]) {
                    categoryData[cat].subCategories[subCat] = 0;
                }
                categoryData[cat].subCategories[subCat] += expense.amount;
            }
        });

        if (totalSpending === 0) {
            document.getElementById('categoryBreakdown').innerHTML = `<div class="empty-state">No expenses to analyze for ${chartTitle}.</div>`;
            const canvas = document.getElementById('categoryChart');
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            if (categoryChart) {
                categoryChart.destroy();
                categoryChart = null;
            }
            return;
        }

        const sortedCategories = Object.entries(categoryData)
            .sort((a, b) => b[1].total - a[1].total);

        const labels = sortedCategories.map(item => item[0]);
        const data = sortedCategories.map(item => item[1].total);
        const colors = [
            '#667eea',
            '#764ba2',
            '#f093fb',
            '#4facfe',
            '#43e97b',
            '#fa709a',
            '#fee140',
            '#30cfd0',
            '#a8edea',
            '#fbc2eb'
        ];

        if (categoryChart) {
            categoryChart.destroy();
        }

        const ctx = document.getElementById('categoryChart').getContext('2d');
        categoryChart = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors,
                    borderWidth: 2,
                    borderColor: '#fff'
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: true,
                plugins: {
                    legend: {
                        position: 'bottom',
                        labels: {
                            padding: 15,
                            font: {
                                size: 12
                            }
                        }
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                const label = context.label || '';
                                const value = context.parsed || 0;
                                const percentage = ((value / totalSpending) * 100).toFixed(1);
                                return `${label}: Rp ${value.toLocaleString('id-ID')} (${percentage}%)`;
                            }
                        }
                    }
                }
            }
        });

        const breakdownDiv = document.getElementById('categoryBreakdown');
        breakdownDiv.innerHTML = '';

        sortedCategories.forEach(([category, data], index) => {
            const percentage = ((data.total / totalSpending) * 100).toFixed(1);
            const hasSubCategories = Object.keys(data.subCategories).length > 0;
            const categoryId = `cat-${index}`;

            const itemDiv = document.createElement('div');
            itemDiv.className = 'breakdown-item';

            const headerDiv = document.createElement('div');
            headerDiv.className = 'breakdown-header';
            if (hasSubCategories) {
                headerDiv.style.cursor = 'pointer';
                headerDiv.onclick = function() {
                    toggleSubCategories(categoryId);
                };
            }

            const infoDiv = document.createElement('div');
            infoDiv.className = 'breakdown-info';

            const categoryDiv = document.createElement('div');
            categoryDiv.className = 'breakdown-category';
            categoryDiv.style.color = colors[index % colors.length];

            if (hasSubCategories) {
                const iconSpan = document.createElement('span');
                iconSpan.className = 'expand-icon';
                iconSpan.id = `icon-${categoryId}`;
                iconSpan.textContent = '▶';
                categoryDiv.appendChild(iconSpan);
            }

            const nameSpan = document.createElement('span');
            nameSpan.textContent = category;
            categoryDiv.appendChild(nameSpan);

            const percentDiv = document.createElement('div');
            percentDiv.className = 'breakdown-percent';
            percentDiv.textContent = `${percentage}% of total spending`;

            const barDiv = document.createElement('div');
            barDiv.className = 'breakdown-bar';
            const fillDiv = document.createElement('div');
            fillDiv.className = 'breakdown-fill';
            fillDiv.style.width = `${percentage}%`;
            fillDiv.style.background = colors[index % colors.length];
            barDiv.appendChild(fillDiv);

            infoDiv.appendChild(categoryDiv);
            infoDiv.appendChild(percentDiv);
            infoDiv.appendChild(barDiv);

            const amountDiv = document.createElement('div');
            amountDiv.className = 'breakdown-amount';
            amountDiv.textContent = `Rp ${data.total.toLocaleString('id-ID')}`;

            headerDiv.appendChild(infoDiv);
            headerDiv.appendChild(amountDiv);
            itemDiv.appendChild(headerDiv);

            if (hasSubCategories) {
                const sortedSubs = Object.entries(data.subCategories)
                    .sort((a, b) => b[1] - a[1]);
                
                const subListDiv = document.createElement('div');
                subListDiv.className = 'subcategory-list';
                subListDiv.id = `sub-${categoryId}`;

                sortedSubs.forEach(([subCat, amount]) => {
                    const subPercentage = ((amount / data.total) * 100).toFixed(1);
                    
                    const subItemDiv = document.createElement('div');
                    subItemDiv.className = 'subcategory-item';

                    const subInfoDiv = document.createElement('div');
                    const subNameDiv = document.createElement('div');
                    subNameDiv.className = 'subcategory-name';
                    subNameDiv.textContent = `↳ ${subCat}`;
                    
                    const subPercentDiv = document.createElement('div');
                    subPercentDiv.className = 'breakdown-percent';
                    subPercentDiv.style.marginTop = '3px';
                    subPercentDiv.textContent = `${subPercentage}% of ${category}`;
                    
                    subInfoDiv.appendChild(subNameDiv);
                    subInfoDiv.appendChild(subPercentDiv);

                    const subAmountDiv = document.createElement('div');
                    subAmountDiv.className = 'subcategory-amount';
                    subAmountDiv.textContent = `Rp ${amount.toLocaleString('id-ID')}`;

                    subItemDiv.appendChild(subInfoDiv);
                    subItemDiv.appendChild(subAmountDiv);
                    subListDiv.appendChild(subItemDiv);
                });

                itemDiv.appendChild(subListDiv);
            }

            breakdownDiv.appendChild(itemDiv);
        });
    }

    function toggleSubCategories(categoryId) {
        const subList = document.getElementById('sub-' + categoryId);
        const icon = document.getElementById('icon-' + categoryId);
        
        if (subList) {
            const isExpanded = subList.classList.contains('expanded');
            
            if (isExpanded) {
                subList.classList.remove('expanded');
                if (icon) {
                    icon.classList.remove('expanded');
                }
            } else {
                subList.classList.add('expanded');
                if (icon) {
                    icon.classList.add('expanded');
                }
            }
        }
    }

    function updateParentCategorySelect() {
        const select = document.getElementById('parentCategorySelect');
        const defaultCategories = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Other'];
        const allCategories = [...defaultCategories, ...customCategories];

        select.innerHTML = '<option value="">Choose a category</option>';
        allCategories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            select.appendChild(option);
        });
    }

    function addSubCategory() {
        const parentCat = document.getElementById('parentCategorySelect').value;
        const subCatInput = document.getElementById('newSubCategoryInput');
        const newSubCat = subCatInput.value.trim();

        if (!parentCat) {
            alert('Please select a category first');
            return;
        }

        if (!newSubCat) {
            alert('Please enter a sub category name');
            return;
        }

        if (!subCategories[parentCat]) {
            subCategories[parentCat] = [];
        }

        if (subCategories[parentCat].includes(newSubCat)) {
            alert('This sub category already exists');
            return;
        }

        subCategories[parentCat].push(newSubCat);
        saveCategories();
        updateCategoryDropdown();
        renderSubCategories();
        subCatInput.value = '';
        
        if (GITHUB_TOKEN && GIST_ID) {
            syncToGist();
        }
    }

    function deleteSubCategory(parentCat, subCat) {
        if (subCategories[parentCat]) {
            subCategories[parentCat] = subCategories[parentCat].filter(s => s !== subCat);
            if (subCategories[parentCat].length === 0) {
                delete subCategories[parentCat];
            }
            saveCategories();
            updateCategoryDropdown();
            renderSubCategories();
            
            if (GITHUB_TOKEN && GIST_ID) {
                syncToGist();
            }
        }
    }

    function renderSubCategories() {
        const list = document.getElementById('subCategoryList');
        list.innerHTML = '';

        const defaultCategories = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Other'];
        const allCategories = [...defaultCategories, ...customCategories];

        allCategories.forEach(cat => {
            const subs = subCategories[cat] || [];
            
            if (subs.length > 0) {
                const title = document.createElement('h3');
                title.style.margin = '25px 0 15px';
                title.style.color = '#666';
                title.textContent = cat;
                list.appendChild(title);

                subs.forEach(sub => {
                    const item = document.createElement('div');
                    item.className = 'category-item';
                    
                    const nameDiv = document.createElement('div');
                    nameDiv.className = 'category-name';
                    nameDiv.textContent = sub;
                    
                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'delete-btn';
                    deleteBtn.textContent = 'Delete';
                    deleteBtn.onclick = function() {
                        deleteSubCategory(cat, sub);
                    };
                    
                    item.appendChild(nameDiv);
                    item.appendChild(deleteBtn);
                    list.appendChild(item);
                });
            }
        });

        if (list.innerHTML === '') {
            list.innerHTML = '<div class="empty-state">No sub categories yet. Add one above!</div>';
        }
    }

    function addCategoryFromPage() {
        const input = document.getElementById('newCategoryInput');
        const newCategory = input.value.trim();
        
        if (!newCategory) {
            alert('Please enter a category name');
            return;
        }

        if (customCategories.includes(newCategory)) {
            alert('This category already exists');
            return;
        }

        const defaultCategories = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Other'];
        if (defaultCategories.includes(newCategory)) {
            alert('This is a default category');
            return;
        }

        customCategories.push(newCategory);
        saveCategories();
        updateCategoryDropdown();
        renderCategories();
        input.value = '';
        
        if (GITHUB_TOKEN && GIST_ID) {
            syncToGist();
        }
    }

    function renderCategories() {
        const list = document.getElementById('categoryList');
        const defaultCategories = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Other'];

        list.innerHTML = '';

        const defaultTitle = document.createElement('h3');
        defaultTitle.style.marginBottom = '15px';
        defaultTitle.style.color = '#666';
        defaultTitle.textContent = 'Default Categories';
        list.appendChild(defaultTitle);
        
        defaultCategories.forEach(cat => {
            const item = document.createElement('div');
            item.className = 'category-item default';
            item.innerHTML = `
                <div class="category-name">
                    ${cat}
                    <span class="default-label">(Default)</span>
                </div>
            `;
            list.appendChild(item);
        });

        if (customCategories.length > 0) {
            const customTitle = document.createElement('h3');
            customTitle.style.margin = '25px 0 15px';
            customTitle.style.color = '#666';
            customTitle.textContent = 'Custom Categories';
            list.appendChild(customTitle);

            customCategories.forEach(cat => {
                const item = document.createElement('div');
                item.className = 'category-item';
                
                const nameDiv = document.createElement('div');
                nameDiv.className = 'category-name';
                nameDiv.textContent = cat;
                
                const deleteBtn = document.createElement('button');
                deleteBtn.className = 'delete-btn';
                deleteBtn.textContent = 'Delete';
                deleteBtn.onclick = function() {
                    openDeleteModal(cat);
                };
                
                item.appendChild(nameDiv);
                item.appendChild(deleteBtn);
                list.appendChild(item);
            });
        }
    }

    document.getElementById('newCategoryInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addCategoryFromPage();
        }
    });

    document.getElementById('newSubCategoryInput').addEventListener('keypress', function(e) {
        if (e.key === 'Enter') {
            addSubCategory();
        }
    });

    function loadExpenses() {}
    function loadCategories() {}
    function saveExpenses() {}
    function saveCategories() {}

    function updateCategoryDropdown() {
        const select = document.getElementById('category');
        
        const defaultCategories = ['Food', 'Transport', 'Shopping', 'Bills', 'Entertainment', 'Other'];
        
        select.innerHTML = '';
        
        const allCategories = [...defaultCategories, ...customCategories];

        allCategories.forEach(cat => {
            const option = document.createElement('option');
            option.value = cat;
            option.textContent = cat;
            select.appendChild(option);

            const subs = subCategories[cat] || [];
            subs.forEach(sub => {
                const subOption = document.createElement('option');
                subOption.value = `${cat}:${sub}`;
                subOption.textContent = `  ↳ ${sub}`;
                subOption.style.paddingLeft = '20px';
                select.appendChild(subOption);
            });
        });
        
        const newOption = document.createElement('option');
        newOption.value = '__new__';
        newOption.textContent = '+ Add New Category';
        select.appendChild(newOption);
    }

    function addExpense() {
        const name = document.getElementById('name').value.trim();
        const amountStr = document.getElementById('amount').value.replace(/\./g, '');
        const amount = parseInt(amountStr);
        const selectedCategory = document.getElementById('category').value;
        const date = document.getElementById('date').value;

        if (!name || !amountStr || !date || isNaN(amount)) {
            alert('Please fill in all fields');
            return;
        }
        
        let category = selectedCategory;
        let subCategory = '';
        
        if (selectedCategory.includes(':')) {
            const parts = selectedCategory.split(':');
            category = parts[0];
            subCategory = parts.slice(1).join(':');
        }

        const expense = {
            id: Date.now(),
            name: name,
            amount: amount,
            category: category,
            subCategory: subCategory,
            date: date
        };

        expenses.push(expense);
        saveExpenses();
        
        renderExpensePageFilter();
        renderAnalyticsPageFilter();
        renderExpenses();
        
        if (GITHUB_TOKEN && GIST_ID) {
            syncToGist();
        }
        
        document.getElementById('name').value = '';
        document.getElementById('amount').value = '';
        document.getElementById('date').value = today;
    }

    function deleteExpense(id) {
        expenses = expenses.filter(exp => exp.id !== id);
        saveExpenses();
        
        renderExpensePageFilter();
        renderAnalyticsPageFilter();
        renderExpenses();
        
        if (GITHUB_TOKEN && GIST_ID) {
            syncToGist();
        }
    }

    function renderExpenses() {
        const list = document.getElementById('expensesList');
        const headerTitle = document.getElementById('headerTitle');
        const monthNames = ["Jan", "Feb", "Mar", "Apr", "Mei", "Jun", "Jul", "Agu", "Sep", "Okt", "Nov", "Des"];

        // 1. FILTER DATA
        let filteredExpenses = expenses;
        let titleText = 'All Expenses';

        if (selectedMonthYear !== 'all') {
            filteredExpenses = expenses.filter(exp => exp.date && exp.date.startsWith(selectedMonthYear));
            
            const dateParts = selectedMonthYear.split('-');
            const year = dateParts[0];
            const monthIndex = parseInt(dateParts[1]) - 1;
            titleText = `${monthNames[monthIndex]} ${year}`;
        }

        // 2. PERBARUI HEADER
        headerTitle.textContent = `💰 Pengeluaran Bulan ${titleText}`;

        // 3. HITUNG TOTAL
        const total = filteredExpenses.reduce((sum, exp) => sum + exp.amount, 0);
        document.getElementById('totalAmount').textContent = `Rp ${total.toLocaleString('id-ID')}`;


        if (filteredExpenses.length === 0) {
            const month = selectedMonthYear !== 'all' ? `bulan ${titleText}` : 'saat ini';
            list.innerHTML = `<div class="empty-state">Tidak ada pengeluaran untuk ${month}.</div>`;
            return;
        }

        // 4. RENDER LIST (diurutkan berdasarkan tanggal terbaru)
        const sorted = [...filteredExpenses].sort((a, b) => new Date(b.date) - new Date(a.date));

        list.innerHTML = sorted.map(expense => {
            const displayCategory = expense.subCategory 
                ? `${expense.category} > ${expense.subCategory}` 
                : expense.category;
                
            return `
            <div class="expense-item">
                <div class="expense-info">
                    <div class="expense-name">
                        ${expense.name}
                        <span class="category-badge">${displayCategory || 'N/A'}</span>
                    </div>
                    <div class="expense-details">${new Date(expense.date + 'T00:00:00').toLocaleDateString('id-ID', { year: 'numeric', month: 'long', day: 'numeric' })}</div>
                </div>
                <div class="expense-amount">Rp ${expense.amount.toLocaleString('id-ID')}</div>
                <button class="delete-btn" onclick="deleteExpense(${expense.id})">Delete</button>
            </div>
            `;
        }).join('');
    }
</script>
